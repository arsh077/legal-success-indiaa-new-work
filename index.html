<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Success India | Modern Legal Compliance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              zinc: {
                850: '#1f2025',
                900: '#18181b',
                950: '#09090b',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      ::selection {
        background-color: #000;
        color: #fff;
      }
      
      .dark ::selection {
        background-color: #fff;
        color: #000;
      }

      /* Animated Grain for Background */
      .bg-grain {
        position: fixed;
        top: 0; left: 0;
        height: 100%; width: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.05;
        background-image: url('https://grainy-gradients.vercel.app/noise.svg');
      }

      #root { position: relative; z-index: 10; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #27272a; }
      ::-webkit-scrollbar-thumb:hover { background: #111; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "maplibre-gl": "https://esm.sh/maplibre-gl@4.0.0",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom",
    "clsx": "https://esm.sh/clsx",
    "tailwind-merge": "https://esm.sh/tailwind-merge",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script>
      // Initialize Theme
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-50 transition-colors duration-500">
    <div class="bg-grain"></div>
    <div id="root"></div>
    <!-- Entry point script -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
